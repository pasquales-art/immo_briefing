name: Daily briefing

on:
  schedule:
    # 04:00 UTC = 05:00 or 06:00 Europe/Zurich depending on DST — well
    # before the 06:30 local read time either way.
    - cron: "0 4 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-briefing
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Generate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/generate_briefing.py

      - name: Commit and push
        run: |
          git config user.name "briefing-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/posts
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Daily briefing $(date -u +%F)"
            git push
          fi
