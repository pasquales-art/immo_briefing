<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Morgenbriefing</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Tägliches Morgenbriefing: Immobilienmarkt, Kapitalmarkt, Politik und Wirtschaft in der Schweiz.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="oklch(98% 0.005 95)" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="oklch(18% 0.01 250)" media="(prefers-color-scheme: dark)">

<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Morgenbriefing">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: oklch(98% 0.005 95);
    --fg: oklch(20% 0.01 95);
    --muted: oklch(46% 0.01 95);
    --border: oklch(88% 0.005 95);
    --card-bg: #ffffff;
    --nav-bg: oklch(98% 0.005 95 / 0.92);
    --accent: #2A4DA0;
    --accent-contrast: #ffffff;

    --font-display: 'Archivo', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;

    --date-size: 50px;
    --section-gap: 26px;

    color-scheme: light dark;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: oklch(18% 0.01 250);
      --fg: oklch(92% 0.005 95);
      --muted: oklch(65% 0.01 95);
      --border: oklch(32% 0.012 95);
      --card-bg: oklch(23% 0.012 250);
      --nav-bg: oklch(20% 0.012 250 / 0.92);
      --accent: color-mix(in oklch, #2A4DA0 62%, white 38%);
      --accent-contrast: oklch(18% 0.01 250);
    }
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--fg);
  }

  body {
    font-family: var(--font-body);
    min-height: 100vh;
    min-height: 100dvh;
    overscroll-behavior-y: none;
  }

  #app {
    max-width: 560px;
    margin: 0 auto;
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  main {
    flex: 1;
    padding: calc(env(safe-area-inset-top, 0px) + 8px) 20px calc(env(safe-area-inset-bottom, 0px) + 100px);
  }

  a { color: var(--accent); }

  /* ---- Today / post view ---- */

  .eyebrow-row {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 16px;
  }

  .eyebrow-left {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .weekly-badge {
    padding: 2px 7px;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--accent);
  }

  /* ---- icon buttons (refresh, bookmark) ---- */

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 28px;
    height: 28px;
    padding: 0;
    margin: 0;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .icon-btn svg { stroke: currentColor; }

  .icon-btn.is-saved { color: var(--accent); }
  .icon-btn.is-saved svg path { fill: currentColor; }

  .icon-btn.is-refreshing svg { animation: icon-spin 0.7s linear infinite; }

  @keyframes icon-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .section-eyebrow-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    padding-top: 16px;
    border-top: 1px solid var(--border);
    margin-bottom: 10px;
  }

  .section-eyebrow-row .section-eyebrow {
    padding-top: 0;
    border-top: none;
    margin-bottom: 0;
  }

  .section-eyebrow-row .icon-btn {
    width: 24px;
    height: 24px;
    flex-shrink: 0;
  }

  .section-highlight {
    transition: background-color 1.1s ease-out;
    border-radius: 3px;
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
    flex-shrink: 0;
  }

  .menu-wrap {
    position: relative;
  }

  .dropdown-menu {
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    min-width: 190px;
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
    padding: 6px;
    display: none;
    z-index: 30;
  }

  .dropdown-menu.open { display: block; }

  .dropdown-item {
    display: block;
    width: 100%;
    text-align: left;
    padding: 10px 10px;
    border: none;
    background: none;
    color: var(--fg);
    font-family: var(--font-body);
    font-size: 14px;
    border-radius: 4px;
    cursor: pointer;
  }

  .dropdown-item:hover,
  .dropdown-item:focus-visible {
    background: var(--bg);
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: calc(env(safe-area-inset-bottom, 0px) + 84px);
    transform: translateX(-50%);
    background: var(--fg);
    color: var(--bg);
    font-family: var(--font-body);
    font-size: 13px;
    line-height: 1.4;
    padding: 10px 16px;
    border-radius: 14px;
    max-width: 86%;
    text-align: center;
    z-index: 50;
    opacity: 0;
    transition: opacity 0.25s ease;
    pointer-events: none;
  }

  .toast.visible { opacity: 1; }

  .date-hero {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: var(--date-size);
    line-height: 0.95;
    letter-spacing: -0.02em;
    color: var(--fg);
    margin: 0 0 24px;
    word-break: break-word;
  }

  .rule {
    height: 1px;
    background: var(--border);
    margin-bottom: 24px;
  }

  .kurzfassung {
    border: 1px solid var(--border);
    border-radius: 3px;
    padding: 18px 16px;
    margin-bottom: var(--section-gap);
    background: var(--card-bg);
  }

  .kurzfassung-label {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 10px;
  }

  .kurzfassung p {
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.55;
    color: var(--fg);
    margin: 0;
  }

  .brief-section {
    margin-bottom: var(--section-gap);
  }

  .brief-section .section-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.12em;
    color: var(--muted);
    text-transform: uppercase;
  }

  .brief-section h3 {
    font-family: var(--font-body);
    font-weight: 600;
    font-size: 19px;
    line-height: 1.3;
    color: var(--fg);
    margin: 0 0 8px;
  }

  .brief-section p {
    font-family: var(--font-body);
    font-size: 15.5px;
    line-height: 1.6;
    color: var(--fg);
    margin: 0 0 10px;
  }

  .brief-section a {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--accent);
    text-decoration: none;
    font-weight: 500;
  }

  .brief-section a:hover { text-decoration: underline; }

  /* ---- empty state ---- */

  .empty-state {
    border: 1px dashed var(--border);
    border-radius: 4px;
    padding: 22px 18px;
  }

  .empty-state p {
    font-family: var(--font-body);
    font-size: 14.5px;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 12px;
  }

  .empty-state p:last-child { margin-bottom: 0; }

  .empty-state a {
    font-weight: 500;
  }

  /* ---- Archiv ---- */

  .page-title {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 32px;
    color: var(--fg);
    margin: 0 0 6px;
  }

  .page-subtitle {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.08em;
    text-transform: uppercase;
    margin-bottom: 22px;
  }

  .archive-list { list-style: none; margin: 0; padding: 0; }

  .archive-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .archive-item a {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    text-decoration: none;
    color: inherit;
  }

  .archive-meta {
    display: flex;
    flex-direction: column;
    gap: 4px;
    min-width: 0;
  }

  .archive-date {
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 0.04em;
  }

  .archive-title {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    color: var(--fg);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }

  .archive-badge {
    flex-shrink: 0;
    font-family: var(--font-mono);
    font-size: 9px;
    letter-spacing: 0.08em;
    color: var(--accent);
    border: 1px solid var(--accent);
    border-radius: 3px;
    padding: 3px 6px;
    text-transform: uppercase;
  }

  /* ---- Gespeichert ---- */

  .saved-list { list-style: none; margin: 0; padding: 0; }

  .saved-item {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 10px;
    padding: 16px 0;
    border-bottom: 1px solid var(--border);
  }

  .saved-item a {
    display: block;
    min-width: 0;
    flex: 1;
    text-decoration: none;
    color: inherit;
  }

  .saved-eyebrow {
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.1em;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .saved-headline {
    font-family: var(--font-body);
    font-size: 15px;
    font-weight: 500;
    color: var(--fg);
    line-height: 1.35;
    margin-bottom: 4px;
  }

  .saved-source {
    font-family: var(--font-mono);
    font-size: 10.5px;
    color: var(--muted);
    letter-spacing: 0.02em;
  }

  .saved-remove {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    font-family: var(--font-mono);
    font-size: 16px;
    line-height: 1;
  }

  /* ---- Settings / Benachrichtigungen ---- */

  .settings-box {
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 18px 16px;
    margin-bottom: 32px;
  }

  .settings-heading {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 14px;
  }

  .settings-hint {
    font-family: var(--font-body);
    font-size: 14px;
    line-height: 1.55;
    color: var(--muted);
    margin: 0;
  }

  .settings-status {
    font-family: var(--font-body);
    font-size: 14px;
    color: var(--fg);
    margin-bottom: 4px;
  }

  .settings-label {
    display: block;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--muted);
    margin: 14px 0 6px;
  }

  .settings-input {
    display: block;
    width: 100%;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--fg);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 9px 10px;
    box-sizing: border-box;
  }

  .settings-input[type="time"] {
    width: 110px;
  }

  .settings-actions {
    display: flex;
    gap: 8px;
    margin-top: 16px;
    flex-wrap: wrap;
  }

  .settings-btn {
    font-family: var(--font-body);
    font-size: 13.5px;
    font-weight: 500;
    color: var(--accent-contrast);
    background: var(--accent);
    border: none;
    border-radius: 4px;
    padding: 10px 14px;
    cursor: pointer;
  }

  .settings-btn-muted {
    color: var(--fg);
    background: none;
    border: 1px solid var(--border);
  }

  /* ---- Themen ---- */

  .topic-pills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .topic-pill {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.04em;
    color: var(--muted);
    border: 1px solid var(--border);
    border-radius: 100px;
    padding: 7px 13px;
    opacity: 0.6;
  }

  /* ---- bottom nav ---- */

  nav.bottom-nav {
    position: fixed;
    left: 0;
    right: 0;
    bottom: 0;
    max-width: 560px;
    margin: 0 auto;
    display: flex;
    justify-content: space-around;
    align-items: center;
    padding: 10px 8px calc(env(safe-area-inset-bottom, 0px) + 4px);
    background: var(--nav-bg);
    backdrop-filter: blur(14px) saturate(180%);
    -webkit-backdrop-filter: blur(14px) saturate(180%);
    border-top: 1px solid var(--border);
  }

  .nav-item {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    padding: 4px 14px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--muted);
  }

  .nav-item.active { color: var(--accent); }
  .nav-item svg { stroke: currentColor; }

  .nav-label {
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.04em;
    color: currentColor;
  }

  .visually-hidden {
    position: absolute;
    width: 1px; height: 1px;
    overflow: hidden;
    clip: rect(0 0 0 0);
    white-space: nowrap;
  }
</style>
</head>
<body>
<div id="app">
  <main id="view" aria-live="polite"></main>

  <nav class="bottom-nav" aria-label="Hauptnavigation">
    <a class="nav-item" data-route="today" href="#/">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><rect x="3" y="2.5" width="14" height="15" rx="1.5" stroke-width="1.6"/><line x1="6" y1="7" x2="14" y2="7" stroke-width="1.6"/></svg>
      <span class="nav-label">Today</span>
    </a>
    <a class="nav-item" data-route="gespeichert" href="#/gespeichert">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M5 3h10v14l-5-4-5 4V3z" stroke-width="1.6" stroke-linejoin="round"/></svg>
      <span class="nav-label">Gespeichert</span>
    </a>
    <a class="nav-item" data-route="archiv" href="#/archiv">
      <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><line x1="3" y1="5" x2="17" y2="5" stroke-width="1.6"/><line x1="3" y1="10" x2="17" y2="10" stroke-width="1.6"/><line x1="3" y1="15" x2="17" y2="15" stroke-width="1.6"/></svg>
      <span class="nav-label">Archiv</span>
    </a>
  </nav>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
(function () {
  'use strict';

  var view = document.getElementById('view');
  var navItems = document.querySelectorAll('.nav-item');

  var WEEKDAYS = ['Sonntag', 'Montag', 'Dienstag', 'Mittwoch', 'Donnerstag', 'Freitag', 'Samstag'];
  var TOPICS = [
    'Leitzinsen & Geldpolitik', 'Immobilienmarkt CH', 'Mietrecht & Baurecht',
    'Kapitalmarkt', 'SFP Soupe du Jour', 'Wohnpolitik',
    'Kantonale Wirtschaftspolitik', 'Stadt Zürich', 'Verkehrspolitik',
    'Volkswirtschaft & Arbeitsmarkt', 'Weltgeschehen'
  ];

  var indexCache = null;
  var SAVED_KEY = 'morgenbriefing:saved';

  function getSaved() {
    try {
      var raw = localStorage.getItem(SAVED_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function setSaved(list) {
    try { localStorage.setItem(SAVED_KEY, JSON.stringify(list)); } catch (e) {}
  }

  function isSaved(id) {
    return getSaved().some(function (s) { return s.id === id; });
  }

  function toggleSaved(entry) {
    var list = getSaved();
    var idx = list.findIndex(function (s) { return s.id === entry.id; });
    if (idx === -1) {
      entry.savedAt = Date.now();
      list.push(entry);
      setSaved(list);
      return true;
    }
    list.splice(idx, 1);
    setSaved(list);
    return false;
  }

  function removeSaved(id) {
    setSaved(getSaved().filter(function (s) { return s.id !== id; }));
  }

  function bookmarkIconSvg() {
    return '<svg width="15" height="15" viewBox="0 0 20 20" fill="none"><path d="M5 3h10v14l-5-4-5 4V3z" stroke-width="1.6" stroke-linejoin="round"/></svg>';
  }

  function makeBookmarkButton(meta) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.innerHTML = bookmarkIconSvg();
    btn.setAttribute('aria-label', 'Für später speichern');
    var sync = function () {
      var saved = isSaved(meta.id);
      btn.classList.toggle('is-saved', saved);
      btn.setAttribute('aria-pressed', saved ? 'true' : 'false');
    };
    btn.addEventListener('click', function (ev) {
      ev.preventDefault();
      ev.stopPropagation();
      toggleSaved({
        id: meta.id,
        date: meta.date,
        postTitle: meta.postTitle,
        sectionIndex: meta.sectionIndex,
        eyebrow: meta.eyebrowText,
        headline: meta.headline
      });
      sync();
    });
    sync();
    return btn;
  }

  function refreshIconSvg() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><path d="M16.5 10a6.5 6.5 0 11-2-4.7" stroke-width="1.6" stroke-linecap="round"/><path d="M16.5 3.5V8h-4.5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  function makeRefreshButton(onRefresh) {
    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.innerHTML = refreshIconSvg();
    btn.setAttribute('aria-label', 'Aktualisieren');
    btn.addEventListener('click', function () {
      if (btn.classList.contains('is-refreshing')) return;
      btn.classList.add('is-refreshing');
      Promise.resolve(onRefresh()).then(function () {
        btn.classList.remove('is-refreshing');
      }, function () {
        btn.classList.remove('is-refreshing');
      });
    });
    return btn;
  }

  var PUSH_WORKER_URL = 'https://immo-briefing.pasci-ryser.workers.dev';
  var VAPID_PUBLIC_KEY = 'BCJZ8K3cMvIF18RHXky2gQy0ZgbhG8kD101Fy0FAVV0hTodvNDeaNK6JD-GqsiP74qClL2h0S8LMVFwDpuFAT-U';
  var PUSH_AUTH_KEY = 'morgenbriefing:pushAuth';

  function getPushAuth() {
    try { return localStorage.getItem(PUSH_AUTH_KEY) || ''; } catch (e) { return ''; }
  }

  function setPushAuth(v) {
    try { localStorage.setItem(PUSH_AUTH_KEY, v); } catch (e) {}
  }

  function urlBase64ToUint8Array(base64String) {
    var padding = '='.repeat((4 - base64String.length % 4) % 4);
    var base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
    var rawData = atob(base64);
    var outputArray = new Uint8Array(rawData.length);
    for (var i = 0; i < rawData.length; i++) outputArray[i] = rawData.charCodeAt(i);
    return outputArray;
  }

  function pushSupported() {
    return 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  }

  function isStandalone() {
    return window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  }

  function pushFetch(path, options) {
    options = options || {};
    var headers = { 'Authorization': 'Bearer ' + getPushAuth() };
    var body;
    if (options.body) {
      headers['Content-Type'] = 'application/json';
      body = JSON.stringify(options.body);
    }
    return fetch(PUSH_WORKER_URL + path, { method: options.method || 'GET', headers: headers, body: body })
      .then(function (res) {
        return res.json().catch(function () { return {}; }).then(function (data) {
          if (!res.ok) throw new Error(data.error || ('HTTP ' + res.status));
          return data;
        });
      });
  }

  function renderNotificationSettings(container) {
    var box = document.createElement('div');
    box.className = 'settings-box';

    var heading = document.createElement('div');
    heading.className = 'settings-heading';
    heading.textContent = 'Benachrichtigungen';
    box.appendChild(heading);

    if (!pushSupported()) {
      var unsupported = document.createElement('p');
      unsupported.className = 'settings-hint';
      unsupported.textContent = 'Push-Benachrichtigungen werden von diesem Browser nicht unterstützt.';
      box.appendChild(unsupported);
      container.appendChild(box);
      return;
    }

    if (!isStandalone()) {
      var notInstalled = document.createElement('p');
      notInstalled.className = 'settings-hint';
      notInstalled.textContent = 'Füge die App zuerst über "Zum Home-Bildschirm" hinzu — Push-Benachrichtigungen funktionieren auf dem iPhone nur in der installierten App.';
      box.appendChild(notInstalled);
      container.appendChild(box);
      return;
    }

    var status = document.createElement('div');
    status.className = 'settings-status';
    status.textContent = 'Lade Status …';
    box.appendChild(status);

    var passLabel = document.createElement('label');
    passLabel.className = 'settings-label';
    passLabel.textContent = 'Passphrase';
    box.appendChild(passLabel);
    var passInput = document.createElement('input');
    passInput.type = 'password';
    passInput.className = 'settings-input';
    passInput.autocomplete = 'off';
    passInput.value = getPushAuth();
    passInput.placeholder = 'Einmalig festgelegte Passphrase';
    box.appendChild(passInput);

    var timeLabel = document.createElement('label');
    timeLabel.className = 'settings-label';
    timeLabel.textContent = 'Uhrzeit';
    box.appendChild(timeLabel);
    var timeInput = document.createElement('input');
    timeInput.type = 'time';
    timeInput.className = 'settings-input';
    timeInput.value = '06:30';
    box.appendChild(timeInput);

    var actions = document.createElement('div');
    actions.className = 'settings-actions';
    var enableBtn = document.createElement('button');
    enableBtn.type = 'button';
    enableBtn.className = 'settings-btn';
    enableBtn.textContent = 'Aktivieren / Speichern';
    var disableBtn = document.createElement('button');
    disableBtn.type = 'button';
    disableBtn.className = 'settings-btn settings-btn-muted';
    disableBtn.textContent = 'Deaktivieren';
    actions.appendChild(enableBtn);
    actions.appendChild(disableBtn);
    box.appendChild(actions);

    function refreshStatus() {
      if (!getPushAuth()) {
        status.textContent = 'Passphrase eingeben und speichern, um den Status zu laden.';
        return;
      }
      pushFetch('/settings').then(function (data) {
        if (data.subscription && data.time) {
          status.textContent = 'Aktiv — täglich um ' + data.time + ' Uhr.';
          timeInput.value = data.time;
        } else {
          status.textContent = 'Noch nicht aktiviert.';
        }
      }).catch(function (err) {
        status.textContent = 'Status konnte nicht geladen werden (' + err.message + ').';
      });
    }

    enableBtn.addEventListener('click', function () {
      setPushAuth(passInput.value);
      status.textContent = 'Aktiviere …';
      Notification.requestPermission().then(function (perm) {
        if (perm !== 'granted') {
          status.textContent = 'Berechtigung für Benachrichtigungen wurde nicht erteilt.';
          return;
        }
        return navigator.serviceWorker.ready.then(function (reg) {
          return reg.pushManager.getSubscription().then(function (existing) {
            return existing || reg.pushManager.subscribe({
              userVisibleOnly: true,
              applicationServerKey: urlBase64ToUint8Array(VAPID_PUBLIC_KEY)
            });
          });
        }).then(function (sub) {
          return pushFetch('/subscribe', { method: 'POST', body: { subscription: sub.toJSON(), time: timeInput.value } });
        }).then(function () {
          status.textContent = 'Aktiv — täglich um ' + timeInput.value + ' Uhr.';
        });
      }).catch(function (err) {
        status.textContent = 'Fehler: ' + err.message;
      });
    });

    disableBtn.addEventListener('click', function () {
      status.textContent = 'Deaktiviere …';
      navigator.serviceWorker.ready.then(function (reg) {
        return reg.pushManager.getSubscription();
      }).then(function (sub) {
        return sub ? sub.unsubscribe() : null;
      }).then(function () {
        return pushFetch('/unsubscribe', { method: 'POST' });
      }).then(function () {
        status.textContent = 'Deaktiviert.';
      }).catch(function (err) {
        status.textContent = 'Fehler: ' + err.message;
      });
    });

    container.appendChild(box);
    refreshStatus();
  }

  var GITHUB_REPO = 'pasquales-art/immo_briefing';
  var GITHUB_WORKFLOW_FILE = 'daily-briefing.yml';

  function showToast(message) {
    var toast = document.createElement('div');
    toast.className = 'toast';
    toast.textContent = message;
    document.body.appendChild(toast);
    requestAnimationFrame(function () { toast.classList.add('visible'); });
    setTimeout(function () {
      toast.classList.remove('visible');
      setTimeout(function () { toast.remove(); }, 300);
    }, 4000);
  }

  // There is no in-app "trigger + wait for completion" here on purpose:
  // doing that would require an authenticated GitHub API call from the
  // browser, which would mean shipping a GitHub token inside this public,
  // unauthenticated PWA's client-side JS — anyone could read it out and
  // abuse it (spam-trigger runs, burn the ANTHROPIC_API_KEY budget). This
  // opens GitHub's own "Run workflow" page instead, where you're already
  // authenticated as yourself and can pick the merge/full mode directly.
  function handleManualUpdate() {
    var url = 'https://github.com/' + GITHUB_REPO + '/actions/workflows/' + GITHUB_WORKFLOW_FILE;
    window.open(url, '_blank', 'noopener');
    showToast('GitHub Actions geöffnet — dort "Run workflow" antippen. Modus "merge" ergänzt nur, statt zu überschreiben.');
  }

  function menuIconSvg() {
    return '<svg width="16" height="16" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="4" r="1.4" fill="currentColor" stroke="none"/><circle cx="10" cy="10" r="1.4" fill="currentColor" stroke="none"/><circle cx="10" cy="16" r="1.4" fill="currentColor" stroke="none"/></svg>';
  }

  function makeMenuButton() {
    var wrap = document.createElement('div');
    wrap.className = 'menu-wrap';

    var btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'icon-btn';
    btn.innerHTML = menuIconSvg();
    btn.setAttribute('aria-label', 'Menü');
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');

    var menu = document.createElement('div');
    menu.className = 'dropdown-menu';
    menu.setAttribute('role', 'menu');

    function onOutsideClick(ev) {
      if (!wrap.contains(ev.target)) closeMenu();
    }

    function onKeydown(ev) {
      if (ev.key === 'Escape') closeMenu();
    }

    function closeMenu() {
      menu.classList.remove('open');
      btn.setAttribute('aria-expanded', 'false');
      document.removeEventListener('click', onOutsideClick);
      document.removeEventListener('keydown', onKeydown);
    }

    function openMenu() {
      menu.classList.add('open');
      btn.setAttribute('aria-expanded', 'true');
      document.addEventListener('click', onOutsideClick);
      document.addEventListener('keydown', onKeydown);
    }

    btn.addEventListener('click', function (ev) {
      ev.stopPropagation();
      if (menu.classList.contains('open')) closeMenu(); else openMenu();
    });

    [
      { label: 'Update Now (Manual)', action: handleManualUpdate },
      { label: 'Bookmarked', action: function () { window.location.hash = '#/gespeichert'; } },
      { label: 'Settings', action: function () { window.location.hash = '#/themen'; } }
    ].forEach(function (item) {
      var el = document.createElement('button');
      el.type = 'button';
      el.className = 'dropdown-item';
      el.setAttribute('role', 'menuitem');
      el.textContent = item.label;
      el.addEventListener('click', function () {
        closeMenu();
        item.action();
      });
      menu.appendChild(el);
    });

    wrap.appendChild(btn);
    wrap.appendChild(menu);
    return wrap;
  }

  function isoToday() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }

  function formatDate(iso) {
    var parts = iso.split('-');
    return parts[2] + '.' + parts[1] + '.' + parts[0];
  }

  function weekdayLabel(iso) {
    var parts = iso.split('-').map(Number);
    var d = new Date(parts[0], parts[1] - 1, parts[2]);
    return WEEKDAYS[d.getDay()].toUpperCase();
  }

  function escapeHtml(s) {
    var div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function loadIndex() {
    if (indexCache) return Promise.resolve(indexCache);
    return fetch('./posts/index.json', { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error('index.json ' + res.status);
        return res.json();
      })
      .then(function (list) {
        list.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
        indexCache = list;
        return list;
      });
  }

  function loadPostMarkdown(item) {
    return fetch('./posts/' + item.file, { cache: 'no-store' })
      .then(function (res) {
        if (!res.ok) throw new Error(item.file + ' ' + res.status);
        return res.text();
      });
  }

  // Splits marked.js output into a kurzfassung box (leading blockquote)
  // and a list of sections, each starting at an <h2> (eyebrow label),
  // followed by an <h3> (headline), <p> (body) and optional <a> (link).
  // Each section gets a bookmark toggle (save-for-later) and a
  // data-section-index for deep-linking from the Gespeichert list.
  function renderBriefBody(markdown, postItem) {
    var html = marked.parse(markdown);
    var tmp = document.createElement('div');
    tmp.innerHTML = html;

    var frag = document.createDocumentFragment();
    var kurzfassung = null;
    var currentSection = null;
    var currentMeta = null;
    var sectionIndex = -1;

    Array.prototype.forEach.call(tmp.childNodes, function (node) {
      if (node.nodeType !== 1) return;
      var tag = node.tagName;

      if (tag === 'BLOCKQUOTE' && !kurzfassung) {
        kurzfassung = document.createElement('div');
        kurzfassung.className = 'kurzfassung';
        var label = document.createElement('div');
        label.className = 'kurzfassung-label';
        label.textContent = 'Kurzfassung';
        kurzfassung.appendChild(label);
        Array.prototype.forEach.call(node.childNodes, function (c) {
          kurzfassung.appendChild(c.cloneNode(true));
        });
        return;
      }

      if (tag === 'H1') return; // title is carried by the masthead date, not repeated in-body

      if (tag === 'H2') {
        sectionIndex += 1;
        currentSection = document.createElement('div');
        currentSection.className = 'brief-section';
        currentSection.dataset.sectionIndex = String(sectionIndex);

        currentMeta = {
          id: postItem.date + '::' + sectionIndex,
          date: postItem.date,
          postTitle: postItem.title,
          sectionIndex: sectionIndex,
          eyebrowText: node.textContent,
          headline: ''
        };

        var eyebrowRow = document.createElement('div');
        eyebrowRow.className = 'section-eyebrow-row';
        var eyebrow = document.createElement('div');
        eyebrow.className = 'section-eyebrow';
        eyebrow.textContent = node.textContent;
        eyebrowRow.appendChild(eyebrow);
        eyebrowRow.appendChild(makeBookmarkButton(currentMeta));
        currentSection.appendChild(eyebrowRow);
        frag.appendChild(currentSection);
        return;
      }

      if (tag === 'H3' && currentSection) {
        var h3 = document.createElement('h3');
        h3.textContent = node.textContent;
        currentSection.appendChild(h3);
        if (currentMeta) currentMeta.headline = node.textContent;
        return;
      }

      var target = currentSection || frag;
      target.appendChild(node.cloneNode(true));
    });

    var out = document.createDocumentFragment();
    if (kurzfassung) out.appendChild(kurzfassung);
    out.appendChild(frag);
    return out;
  }

  function renderMasthead(iso, weekly, onRefresh) {
    var wrap = document.createElement('div');

    var eyebrowRow = document.createElement('div');
    eyebrowRow.className = 'eyebrow-row';

    var left = document.createElement('div');
    left.className = 'eyebrow-left';
    var dateSpan = document.createElement('span');
    dateSpan.textContent = formatDate(iso);
    left.appendChild(dateSpan);
    if (weekly) {
      var badge = document.createElement('span');
      badge.className = 'weekly-badge';
      badge.textContent = 'Mit Wochenrückblick';
      left.appendChild(badge);
    }
    eyebrowRow.appendChild(left);

    if (onRefresh) {
      var actions = document.createElement('div');
      actions.className = 'header-actions';
      actions.appendChild(makeRefreshButton(onRefresh));
      actions.appendChild(makeMenuButton());
      eyebrowRow.appendChild(actions);
    }

    wrap.appendChild(eyebrowRow);

    var hero = document.createElement('div');
    hero.className = 'date-hero';
    hero.textContent = weekdayLabel(iso);
    wrap.appendChild(hero);

    var rule = document.createElement('div');
    rule.className = 'rule';
    wrap.appendChild(rule);

    return wrap;
  }

  function renderEmptyToday(iso) {
    var wrap = document.createElement('div');
    wrap.appendChild(renderMasthead(iso, false, refreshCurrentRoute));

    var box = document.createElement('div');
    box.className = 'empty-state';
    var p1 = document.createElement('p');
    p1.textContent = 'Noch kein Briefing für heute veröffentlicht.';
    var p2 = document.createElement('p');
    p2.innerHTML = 'Die letzte Ausgabe findest du im <a href="#/archiv">Archiv</a>.';
    box.appendChild(p1);
    box.appendChild(p2);
    wrap.appendChild(box);

    return wrap;
  }

  function renderPostNotFound(iso) {
    var wrap = document.createElement('div');
    var box = document.createElement('div');
    box.className = 'empty-state';
    var p1 = document.createElement('p');
    p1.textContent = 'Diese Ausgabe wurde nicht gefunden.';
    var p2 = document.createElement('p');
    p2.innerHTML = 'Zurück zum <a href="#/archiv">Archiv</a>.';
    box.appendChild(p1);
    box.appendChild(p2);
    wrap.appendChild(box);
    return wrap;
  }

  function renderPost(item, isToday, sectionToHighlight) {
    var wrap = document.createElement('div');
    wrap.appendChild(renderMasthead(item.date, !!item.weekly, isToday ? refreshCurrentRoute : null));

    var body = document.createElement('div');
    body.className = 'brief-body';
    wrap.appendChild(body);

    document.title = item.title + ' — Morgenbriefing';

    loadPostMarkdown(item)
      .then(function (md) {
        body.appendChild(renderBriefBody(md, item));
        if (sectionToHighlight != null) {
          var target = body.querySelector('[data-section-index="' + sectionToHighlight + '"]');
          if (target) {
            target.classList.add('section-highlight');
            target.scrollIntoView({ behavior: 'smooth', block: 'start' });
            requestAnimationFrame(function () {
              target.style.backgroundColor = 'color-mix(in oklch, var(--accent) 12%, transparent)';
              setTimeout(function () { target.style.backgroundColor = 'transparent'; }, 900);
            });
          }
        }
      })
      .catch(function () {
        var err = document.createElement('div');
        err.className = 'empty-state';
        var p = document.createElement('p');
        p.textContent = 'Diese Ausgabe konnte nicht geladen werden.';
        err.appendChild(p);
        body.appendChild(err);
      });

    return wrap;
  }

  function renderArchiv(list) {
    var wrap = document.createElement('div');

    var title = document.createElement('div');
    title.className = 'page-title';
    title.textContent = 'Archiv';
    wrap.appendChild(title);

    var subtitle = document.createElement('div');
    subtitle.className = 'page-subtitle';
    subtitle.textContent = 'Alle Ausgaben';
    wrap.appendChild(subtitle);

    if (!list.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var p = document.createElement('p');
      p.textContent = 'Noch keine Ausgaben vorhanden.';
      empty.appendChild(p);
      wrap.appendChild(empty);
      return wrap;
    }

    var ul = document.createElement('ul');
    ul.className = 'archive-list';

    list.forEach(function (item) {
      var li = document.createElement('li');
      li.className = 'archive-item';

      var a = document.createElement('a');
      a.href = '#/post/' + item.date;

      var meta = document.createElement('div');
      meta.className = 'archive-meta';
      var d = document.createElement('div');
      d.className = 'archive-date';
      d.textContent = formatDate(item.date);
      var t = document.createElement('div');
      t.className = 'archive-title';
      t.textContent = item.title;
      meta.appendChild(d);
      meta.appendChild(t);
      a.appendChild(meta);

      if (item.weekly) {
        var badge = document.createElement('span');
        badge.className = 'archive-badge';
        badge.textContent = 'Woche';
        a.appendChild(badge);
      }

      li.appendChild(a);
      ul.appendChild(li);
    });

    wrap.appendChild(ul);
    return wrap;
  }

  function renderGespeichert() {
    var wrap = document.createElement('div');

    var title = document.createElement('div');
    title.className = 'page-title';
    title.textContent = 'Gespeichert';
    wrap.appendChild(title);

    var subtitle = document.createElement('div');
    subtitle.className = 'page-subtitle';
    subtitle.textContent = 'Später lesen';
    wrap.appendChild(subtitle);

    var saved = getSaved().slice().sort(function (a, b) { return b.savedAt - a.savedAt; });

    if (!saved.length) {
      var empty = document.createElement('div');
      empty.className = 'empty-state';
      var p = document.createElement('p');
      p.textContent = 'Noch keine gemerkten Artikel.';
      var p2 = document.createElement('p');
      p2.textContent = 'Tippe beim Artikel auf das Lesezeichen-Symbol, um ihn hier zu speichern.';
      empty.appendChild(p);
      empty.appendChild(p2);
      wrap.appendChild(empty);
      return wrap;
    }

    var ul = document.createElement('ul');
    ul.className = 'saved-list';

    saved.forEach(function (entry) {
      var li = document.createElement('li');
      li.className = 'saved-item';

      var a = document.createElement('a');
      a.href = '#/post/' + entry.date + '/' + entry.sectionIndex;

      var eyebrow = document.createElement('div');
      eyebrow.className = 'saved-eyebrow';
      eyebrow.textContent = entry.eyebrow || '';
      a.appendChild(eyebrow);

      var headline = document.createElement('div');
      headline.className = 'saved-headline';
      headline.textContent = entry.headline || entry.postTitle;
      a.appendChild(headline);

      var source = document.createElement('div');
      source.className = 'saved-source';
      source.textContent = formatDate(entry.date) + ' · ' + entry.postTitle;
      a.appendChild(source);

      li.appendChild(a);

      var removeBtn = document.createElement('button');
      removeBtn.type = 'button';
      removeBtn.className = 'saved-remove';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', 'Entfernen');
      removeBtn.addEventListener('click', function () {
        removeSaved(entry.id);
        renderView(renderGespeichert());
      });
      li.appendChild(removeBtn);

      ul.appendChild(li);
    });

    wrap.appendChild(ul);
    return wrap;
  }

  function renderThemen() {
    var wrap = document.createElement('div');

    var title = document.createElement('div');
    title.className = 'page-title';
    title.textContent = 'Einstellungen';
    wrap.appendChild(title);

    renderNotificationSettings(wrap);

    var topicsHeading = document.createElement('div');
    topicsHeading.className = 'settings-heading';
    topicsHeading.textContent = 'Themen';
    wrap.appendChild(topicsHeading);

    var box = document.createElement('div');
    box.className = 'empty-state';
    var p = document.createElement('p');
    p.textContent = 'Themen-Auswahl folgt in einer späteren Version — hier wirst du steuern können, welche der folgenden Kategorien im täglichen Briefing erscheinen.';
    box.appendChild(p);
    wrap.appendChild(box);

    var pills = document.createElement('div');
    pills.className = 'topic-pills';
    pills.style.marginTop = '24px';
    TOPICS.forEach(function (t) {
      var pill = document.createElement('span');
      pill.className = 'topic-pill';
      pill.textContent = t;
      pills.appendChild(pill);
    });
    wrap.appendChild(pills);

    return wrap;
  }

  function setActiveNav(route) {
    navItems.forEach(function (el) {
      el.classList.toggle('active', el.getAttribute('data-route') === route);
    });
  }

  function renderView(node) {
    view.innerHTML = '';
    view.appendChild(node);
    window.scrollTo(0, 0);
  }

  function parseHash() {
    var h = (window.location.hash || '').replace(/^#/, '');
    if (h === '' || h === '/') return { route: 'today' };
    if (h === '/archiv') return { route: 'archiv' };
    if (h === '/themen') return { route: 'themen' };
    if (h === '/gespeichert') return { route: 'gespeichert' };
    var m = h.match(/^\/post\/(\d{4}-\d{2}-\d{2})(?:\/(\d+))?$/);
    if (m) return { route: 'post', date: m[1], section: m[2] != null ? Number(m[2]) : null };
    return { route: 'today' };
  }

  function route() {
    var r = parseHash();

    if (r.route === 'today') {
      setActiveNav('today');
      return loadIndex().then(function (list) {
        var todayIso = isoToday();
        var item = list.find(function (i) { return i.date === todayIso; });
        renderView(item ? renderPost(item, true) : renderEmptyToday(todayIso));
      }).catch(function () {
        renderView(renderEmptyToday(isoToday()));
      });
    }

    if (r.route === 'archiv') {
      setActiveNav('archiv');
      return loadIndex().then(function (list) {
        renderView(renderArchiv(list));
      }).catch(function () {
        renderView(renderArchiv([]));
      });
    }

    if (r.route === 'gespeichert') {
      setActiveNav('gespeichert');
      renderView(renderGespeichert());
      return Promise.resolve();
    }

    if (r.route === 'themen') {
      setActiveNav('themen');
      renderView(renderThemen());
      return Promise.resolve();
    }

    if (r.route === 'post') {
      setActiveNav('today');
      return loadIndex().then(function (list) {
        var item = list.find(function (i) { return i.date === r.date; });
        var isToday = r.date === isoToday();
        renderView(item ? renderPost(item, isToday, r.section) : renderPostNotFound(r.date));
      }).catch(function () {
        renderView(renderPostNotFound(r.date));
      });
    }

    return Promise.resolve();
  }

  function refreshCurrentRoute() {
    indexCache = null;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistration().then(function (reg) {
        if (reg) reg.update();
      }).catch(function () {});
    }
    return route();
  }

  window.addEventListener('hashchange', route);
  window.addEventListener('DOMContentLoaded', route);
  if (document.readyState !== 'loading') route();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
})();
</script>
